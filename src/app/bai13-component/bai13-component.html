<h2>Danh sách sản phẩm</h2>

<table border="1">
  <tr>
    <th>Mã sản phẩm</th>
    <th>Tên sản phẩm</th>
    <th>Giá sản phẩm</th>
    <th>Hình ảnh</th>
    <th>#</th>
  </tr>

  <tbody *ngFor="let p of products">
    <tr>
      <td>{{ p.ProductId }}</td>
      <td>{{ p.ProductName }}</td>
      <td>{{ p.Price }}</td>

      <td>
        <img
          [src]="p.Image"
          width="100"
          height="100"
        >
      </td>

      <td>
        <a
          style="cursor: pointer;"
          (click)="viewDetail(p)"
        >
          Details
        </a>
      </td>
    </tr>
  </tbody>
</table>
