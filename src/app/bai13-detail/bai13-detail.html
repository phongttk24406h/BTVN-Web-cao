<h2>Chi tiết sản phẩm</h2>

<button (click)="goBack()">Go Back</button>

<table border="1">
  <tr>
    <td>ID:</td>
    <td>{{ selectedProduct.ProductId }}</td>
  </tr>

  <tr>
    <td>Name:</td>
    <td>{{ selectedProduct.ProductName }}</td>
  </tr>

  <tr>
    <td>Price:</td>
    <td>{{ selectedProduct.Price }}</td>
  </tr>

  <tr>
    <td>Picture:</td>
    <td>
      <img
        [src]="selectedProduct.Image"
        width="150"
        height="150"
      >
    </td>
  </tr>
</table>
